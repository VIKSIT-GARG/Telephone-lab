name: Telephone Lab checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --test tests/*.test.mjs
      - run: node scripts/phase2/checker-eval.mjs
      - run: node scripts/phase2/mutations.mjs
      - run: node scripts/phase2/real-eval.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      # Live tests are explicit opt-in commands, not synthetic CI passes.
